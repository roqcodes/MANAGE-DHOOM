<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EB205F" />
    <title>Offline — DHOOM Trading Manage</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: #e0f2fe;
        color: #0369a1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }
      h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
      p { margin: 0; max-width: 22rem; font-size: 0.875rem; line-height: 1.5; color: #475569; }
      ul { text-align: left; font-size: 0.75rem; color: #64748b; max-width: 18rem; }
      .btn {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        background: #eb205f;
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon" aria-hidden="true">📡</div>
    <p style="font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #94a3b8;">
      DHOOM Trading Manage
    </p>
    <h1>No connection</h1>
    <p>
      You're offline. Reconnect to the internet, then reload to continue working with live ERP data.
    </p>
    <ul>
      <li>Check Wi‑Fi or mobile data</li>
      <li>Reload once you're back online</li>
    </ul>
    <button type="button" class="btn" onclick="location.reload()">Reload</button>
  </body>
</html>
